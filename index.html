<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bålbortførelsen</title>
  <meta name="description" content="Du bliver bortført. Til bål.">
  <meta name="theme-color" content="#0A0E1A">
  <meta property="og:title" content="Bålbortførelsen">
  <meta property="og:description" content="Du bliver bortført. Til bål.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://phone-lime-five.vercel.app/">
  <meta property="og:image" content="https://phone-lime-five.vercel.app/bg/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://phone-lime-five.vercel.app/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,600&family=Azeret+Mono:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="glow" id="glow" aria-hidden="true"></div>
  <canvas id="embers" aria-hidden="true"></canvas>
  <canvas id="sparks" aria-hidden="true"></canvas>

  <main id="scenes">

    <section class="scene active" data-scene="unlock" aria-label="Lås op">
      <p class="eyebrow">Sag nr.</p>
      <div class="digits" id="digits">
        <span>22</span><span>18</span><span>26</span><span class="blank" id="blank"><b id="b1">_</b><b id="b2">_</b></span>
      </div>
      <p class="line" id="unlock-line">Tast de 2 manglende cifre.</p>
      <div class="keypad" id="keypad" role="group" aria-label="Tastatur">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" class="ghost" data-k="del" aria-label="Slet">⌫</button><button type="button" data-k="0">0</button><button type="button" class="ghost" aria-hidden="true" tabindex="-1"></button>
      </div>
    </section>

    <section class="scene has-media" data-scene="kidnap" aria-label="Bortførelse">
      <video class="scene-media portrait" autoplay muted loop playsinline preload="metadata" poster="/bg/meadow-9x16.jpg" aria-hidden="true" tabindex="-1">
        <source src="/bg/meadow-9x16.webm" type="video/webm">
        <source src="/bg/meadow-9x16.mp4" type="video/mp4">
      </video>
      <video class="scene-media landscape" autoplay muted loop playsinline preload="metadata" poster="/bg/meadow-16x9.jpg" aria-hidden="true" tabindex="-1">
        <source src="/bg/meadow-16x9.webm" type="video/webm">
        <source src="/bg/meadow-16x9.mp4" type="video/mp4">
      </video>
      <h1 class="display">Du bliver<br>bortført.</h1>
      <button class="btn big" id="where" type="button">Hvorhen?</button>
      <h1 class="display fire hidden" id="where-answer">Til bål.</h1>
      <button class="btn next hidden" data-next type="button">Videre</button>
    </section>

    <section class="scene has-media" data-scene="fire" aria-label="Bålet">
      <video class="scene-media" autoplay muted loop playsinline preload="metadata" poster="/bg/close-16x9.jpg" aria-hidden="true" tabindex="-1">
        <source src="/bg/close-16x9.webm" type="video/webm">
        <source src="/bg/close-16x9.mp4" type="video/mp4">
      </video>
      <p class="line" id="fire-line">Tryk på bålet 3 gange.</p>
      <div class="firebox" id="firebox">
        <canvas id="firecanvas"></canvas>
        <div class="mallow hidden" id="mallow"><div class="stick"></div><div class="puff" id="puff"></div></div>
      </div>
      <div class="row" id="fire-actions">
        <button class="btn hidden" id="light" type="button">Tænd</button>
        <button class="btn hidden" id="roast" type="button">Hold for at riste</button>
        <button class="btn next hidden" data-next type="button">Videre</button>
      </div>
    </section>

    <section class="scene" data-scene="stars" aria-label="Stjerner">
      <p class="line" id="stars-line">Lav tre stjerneskud.</p>
      <div class="tap-prompt" aria-hidden="true"><span class="tap-pulse"></span><span id="star-count">Tryk på himlen · 0/3</span></div>
      <div class="tapzone" id="tapzone" aria-label="Himlen"></div>
      <button class="btn next hidden" data-next type="button">Videre</button>
    </section>

    <section class="scene" data-scene="hair" aria-label="Håret">
      <p class="line" id="hair-line">Ja. Det kommer til at lugte.</p>
      <div class="camp" id="camp">
        <svg viewBox="0 0 400 220" aria-hidden="true">
          <defs>
            <linearGradient id="smokeg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9A93A8" stop-opacity=".55"/><stop offset="1" stop-color="#9A93A8" stop-opacity="0"/></linearGradient>
          </defs>
          <ellipse cx="200" cy="196" rx="170" ry="10" fill="#131A2C"/>
          <g id="smoke" class="smoke">
            <path d="M200 150 C 210 120, 180 100, 200 70 C 215 45, 190 30, 200 5" stroke="url(#smokeg)" stroke-width="26" fill="none" stroke-linecap="round"/>
          </g>
          <g id="fire-svg"><path d="M200 165c6-26 30-34 30-64 0 12-8 20-14 24 2-16-6-30-16-40 4 18-12 26-12 46 0-8-6-12-8-18-10 14-10 32 4 44-8-4-14-10-14-20 0 24 12 36 30 36 18 0 30-12 30-36 0 16-10 24-30 28z" fill="#FF8A3D"/><path d="M200 165c4-14 16-18 16-34 0 6-4 10-7 12 1-8-3-15-9-20 2 9-6 13-6 23 0-4-3-6-4-9-5 7-5 16 2 22-4-2-7-5-7-10 0 12 6 18 15 18s15-6 15-18c0 8-5 12-15 16z" fill="#FFC46B"/></g>
          <rect x="175" y="165" width="50" height="8" rx="3" fill="#4A3324"/>
          <g id="her" class="person"><circle cx="90" cy="120" r="14" fill="#F6EFE4"/><path id="hairpath" d="M74 118c0-18 32-18 32 0v14c-6-8-26-8-32 0z" fill="#3B2A24"/><rect x="80" y="134" width="20" height="40" rx="8" fill="#B5473A"/><g id="hat" class="hidden"><path d="M72 116c0-12 36-12 36 0" fill="#FFC46B"/><rect x="70" y="112" width="40" height="7" rx="3" fill="#FFC46B"/></g></g>
          <g id="me" class="person"><circle cx="310" cy="120" r="14" fill="#F6EFE4"/><path d="M296 118c0-14 28-14 28 0" fill="#3B2A24"/><rect x="300" y="134" width="20" height="40" rx="8" fill="#3E5A82"/></g>
          <text id="me-label" x="310" y="192" text-anchor="middle" font-size="11" fill="#8C8798" font-family="Azeret Mono, monospace">mig</text>
          <text x="90" y="192" text-anchor="middle" font-size="11" fill="#8C8798" font-family="Azeret Mono, monospace">dig</text>
        </svg>
      </div>
      <div class="row">
        <button class="btn" id="wind" type="button">Vend vinden</button>
        <button class="btn" id="hatbtn" type="button">Hue på</button>
        <button class="btn next hidden" data-next type="button">Videre</button>
      </div>
    </section>

    <section class="scene" data-scene="rsvp" aria-label="Svar">
      <h1 class="display">Kommer du?</h1>
      <div class="buttons" id="buttons">
        <button class="btn yes" id="yes" type="button">Ja</button>
        <button class="btn no" id="no" type="button">Nej</button>
      </div>
      <p class="line" id="taunt" aria-live="polite"></p>
      <div class="done hidden" id="done">
        <h1 class="display fire">Det tænkte jeg nok.</h1>
        <p class="line">Du hører fra mig. Ikke hvornår.</p>
        <a class="btn hidden" id="reply" href="#">Sig det til ham</a>
      </div>
    </section>

  </main>

  <nav class="dots" id="dots" aria-label="Fremskridt"></nav>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
